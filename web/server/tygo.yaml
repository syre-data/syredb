type_mappings:
  uuid.UUID: "uuid.UUIDTypes" # include `import * as uuid from "uuid"` in frontmatter
  time.Time: "Date"
  os.File: "File"
packages:
  - path: "syredb/service"
    output_path: "../frontend/src/types/service.ts"
    exclude_files:
      - "auth.service.go"
    frontmatter: |
      import * as uuid from "uuid"
    enum_style: "union"

  - path: "syredb/handler"
    output_path: "../frontend/src/types/errors.ts"
    include_files:
      - "errors.go"
    frontmatter: |
      import * as uuid from "uuid"
    enum_style: "union"

  - path: "syredb/handler"
    output_path: "../frontend/src/types/handler.ts"
    exclude_files:
      - "errors.go"
      - "auth.handler.go"
    frontmatter: |
      import * as uuid from "uuid"
    enum_style: "union"
